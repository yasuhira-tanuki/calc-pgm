[package]
name = "calc-pgm-mcp"
version = "0.1.0"
edition = "2021"
description = "calc-pgm の計算エンジンを FFI 埋め込みした単一バイナリ MCP サーバー"

[[bin]]
name = "calc-pgm-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "2.2", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
schemars = "1"

[build-dependencies]
cc = "1"
